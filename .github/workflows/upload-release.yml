name: Upload release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.1.1)'
        required: false
        default: 'v2.1.1'
  
jobs:
    call-build:
      uses: ./.github/workflows/build-artifacts.yml

      permissions:
        id-token: write
        contents: read
        attestations: write

    create-release:
      name: Create release
      runs-on: ubuntu-latest
    
      permissions:
        contents: write

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Resolve tag name
          id: tag
          shell: bash
          run: |
            TAG="${{ inputs.tag_name || github.ref_name }}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"

        - name: Generate release notes
          id: notes
          uses: RedCrafter07/release-notes-action@v1.0.0
          continue-on-error: true
          with:
            tag-name: ${{ steps.tag.outputs.tag }}
            token: ${{ secrets.GITHUB_TOKEN }}
            branch: 'master'

        # 自动生成的正文是 commit message 拼出来的，反引号很容易混进去。而 1.5.10 / 1.6.0
        # 渲染 Markdown 代码元素会崩溃、老用户一开软件就闪退（见 CIUtils/check-release-notes.py）。
        # 这份文案没人斟酌过，剥掉代码语法不损语义，所以这里直接净化而不是卡住发版；人手编辑
        # 正文那条路由 check-release-notes.yml 硬拦。
        - name: Sanitize release notes
          id: safe_notes
          shell: bash
          env:
            NOTES: ${{ steps.notes.outputs.release-notes }}
          run: |
            python3 -m pip install --quiet markdown-it-py
            printf '%s\n' "$NOTES" > notes.md
            python3 CIUtils/check-release-notes.py notes.md --fix > notes.safe.md
            {
              echo 'notes<<TUNELAB_NOTES_EOF'
              cat notes.safe.md
              # 兜底换行：正文末尾若不带换行，分隔符会被拼到最后一行尾巴上，GitHub 报
              # "Matching delimiter not found"，整个发版就停在建 release 之前。
              echo ''
              echo 'TUNELAB_NOTES_EOF'
            } >> "$GITHUB_OUTPUT"

        - name: Create release
          id: create_release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ steps.tag.outputs.tag }}
            name: TuneLab ${{ steps.tag.outputs.tag }}
            body: ${{ steps.safe_notes.outputs.notes }}
            draft: false
            prerelease: false
    
    installer:
      name: Build Windows installer
      needs: create-release
      runs-on: windows-latest

      permissions:
        contents: write

      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Install .NET Core
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: 8.0.x

        - name: Resolve version (strip leading v)
          id: ver
          shell: pwsh
          run: |
            $ref = "${{ inputs.tag_name || github.ref_name }}"
            $v = $ref.TrimStart('v')
            "version=$v" >> $env:GITHUB_OUTPUT
            "tag=$ref" >> $env:GITHUB_OUTPUT

        - name: Pack installer
          shell: pwsh
          run: ./CIUtils/pack-installer.ps1 -Version ${{ steps.ver.outputs.version }}

        - name: Upload installer to release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ steps.ver.outputs.tag }}
            files: TuneLab.Setup/bin/installer/TuneLab-Setup-win-x64-v${{ steps.ver.outputs.version }}.exe

    release-windows:
      name: Package & Upload Windows
      needs: [create-release]
      runs-on: windows-latest
      permissions:
        contents: write
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Install .NET Core
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: 8.0.x

        - name: Resolve version (strip leading v)
          id: ver
          shell: pwsh
          run: |
            $ref = "${{ inputs.tag_name || github.ref_name }}"
            $v = $ref.TrimStart('v')
            "version=$v" >> $env:GITHUB_OUTPUT
            "tag=$ref" >> $env:GITHUB_OUTPUT

        - name: Publish Windows binaries
          shell: pwsh
          run: |
            dotnet publish TuneLab/TuneLab.csproj -c Release -r win-x64 --self-contained
            dotnet publish TuneLab.Cli/TuneLab.Cli.csproj -c Release -r win-x64 --self-contained
            Copy-Item "TuneLab.Cli/bin/Release/net8.0/win-x64/publish/*" -Destination "TuneLab/bin/Release/net8.0/win-x64/publish/" -Recurse -Force
            Compress-Archive -Path "TuneLab/bin/Release/net8.0/win-x64/publish/*" -DestinationPath "TuneLab-win-x64-v${{ steps.ver.outputs.version }}.zip"

        - name: Upload Windows zip
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ steps.ver.outputs.tag }}
            files: TuneLab-win-x64-v${{ steps.ver.outputs.version }}.zip

    release-macos:
      name: Package & Upload macOS Universal
      needs: [create-release]
      runs-on: macos-latest
      permissions:
        contents: write
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Install .NET Core
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: 8.0.x

        - name: Resolve version (strip leading v)
          id: ver
          shell: bash
          run: |
            ref="${{ inputs.tag_name || github.ref_name }}"
            v="${ref#v}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tag=$ref" >> "$GITHUB_OUTPUT"

        - name: Build and Package macOS Universal Bundle
          shell: bash
          run: |
            chmod +x tools/package-macos.sh
            ./tools/package-macos.sh universal Release ${{ steps.ver.outputs.version }}

        - name: Upload macOS assets
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ steps.ver.outputs.tag }}
            files: |
              artifacts/TuneLab-osx-universal-v${{ steps.ver.outputs.version }}.dmg
              artifacts/TuneLab-osx-universal-v${{ steps.ver.outputs.version }}.zip

    release-linux:
      name: Package & Upload Linux (tar.gz, deb, rpm)
      needs: [create-release]
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Install .NET Core
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: 8.0.x

        - name: Install packaging tools (rpm)
          run: |
            sudo apt-get update
            sudo apt-get install -y rpm

        - name: Resolve version (strip leading v)
          id: ver
          shell: bash
          run: |
            ref="${{ inputs.tag_name || github.ref_name }}"
            v="${ref#v}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tag=$ref" >> "$GITHUB_OUTPUT"

        - name: Build and Package Linux artifacts
          shell: bash
          run: |
            chmod +x CIUtils/package-linux.sh
            ./CIUtils/package-linux.sh ${{ steps.ver.outputs.version }} Release

        - name: Upload Linux assets
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ steps.ver.outputs.tag }}
            files: |
              dist/TuneLab-linux-x64-v${{ steps.ver.outputs.version }}.tar.gz
              dist/tunelab_${{ steps.ver.outputs.version }}_amd64.deb
              dist/*.rpm